ems_server:
  api_token: dev-token-change-in-production
  timeout: 10
  url: http://192.168.1.100:8080
gateway:
  id: raspi-gateway-01
  location: ''
  name: EMS Gateway RPi
gather_data:
  db_path: gather_data.db
  enabled: true
modbus:
  baudrate: 9600
  bytesize: 8
  parity: N
  port: /dev/ttyUSB0
  stopbits: 1
  timeout: 3
polling:
  enabled: false
  interval_seconds: 60
sensors:
- enabled: true
  humidity_register: 2
  humidity_scale: 10.0
  id: S1
  name: Sensor Ambient
  slave_id: 1
  temp_register: 1
  temp_scale: 10.0
- enabled: true
  humidity_register: 2
  humidity_scale: 10.0
  id: S2
  name: Sensor Hotspot
  slave_id: 2
  temp_register: 1
  temp_scale: 10.0
